openapi: 3.0.3
info:
  title: Graham Select System - OpenAPI 3.0
  version: 1.0.0
  description: >-
    Aplicativo para identificar as 20 empresas mais baratas usando a regra de
    Benjamin Graham.
  contact:
    email: afssistemas@gmail.com
    name: Alexandro Sousa
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://domain/api/v1
tags:
  - name: Financial Data
    description: Dados financeiros das empresas
  - name: Admin - DLQ
    description: Gestão da fila de falhas de ingestão (Dead Letter Queue)
paths:
  /upload-financial-data:
    post:
      summary: Upload de arquivos de dados financeiros
      description: Endpoint para enviar arquivos de dados financeiros para o sistema.
      tags:
        - Financial Data
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo CSV contendo dados financeiros das empresas.
      responses:
        '200':
          description: Upload bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Arquivo carregado com sucesso."
        '400':
          description: Requisição inválida ou arquivo incorreto
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro ao processar o arquivo. Verifique o formato."
        '500':
          description: Erro interno no servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro no servidor ao processar o upload."
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro inesperado. Entre em contato com o suporte."
  /ranked-companies:
    get:
      summary: Consulta das empresas ranqueadas
      description: Retorna as 20 empresas mais baratas com base no cálculo do valor intrínseco.
      tags:
        - Financial Data
      responses:
        '200':
          description: Lista de empresas ranqueadas retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankedCompany'
        '403':
          description: Funcionalidade disponível apenas para assinantes Premium ou Trial válido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erro interno no servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me:
    get:
      summary: Retorna o perfil do usuário atual
      description: Retorna o perfil do usuário autenticado no sistema.
      tags:
        - User
      responses:
        '200':
          description: Perfil do usuário retornado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno no servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Solicita a exclusão permanente da conta
      description: Inicia o processo de expurgo de dados conforme LGPD. O processo é assíncrono.
      tags:
        - User
      responses:
        '202':
          description: Solicitação de exclusão aceita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequestResponse'
        '409':
          description: Já existe uma solicitação pendente para este usuário
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /users/me/cancel-deletion:
    post:
      summary: Cancela uma solicitação de exclusão pendente
      description: Se o expurgo ainda não tiver sido executado, cancela a solicitação.
      tags:
        - User
      responses:
        '200':
          description: Solicitação cancelada com sucesso
        '404':
          description: Nenhuma solicitação pendente encontrada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /users/profile:
    patch:
      summary: Atualiza o perfil do investidor
      description: Atualiza o perfil do investidor (Suitability) do usuário autenticado.
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno no servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/dlq:
    get:
      summary: Lista as falhas de ingestão na Dead Letter Queue
      description: Retorna itens da DLQ ordenados por data decrescente com anonimização de usuário.
      tags:
        - Admin - DLQ
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, REPROCESSING, RESOLVED, FAILED]
            default: PENDING
      responses:
        '200':
          description: Lista de falhas retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DlqMessageDto'
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso restrito a administradores
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /admin/dlq/{id}/reprocess:
    post:
      summary: Reprocessa manualmente um item individual da DLQ
      description: Reconstrói o evento de domínio e republica no tópico trade-extracted.
      tags:
        - Admin - DLQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Resultado do reprocessamento
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DlqReprocessResultDto'
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso restrito a administradores
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Item da DLQ não encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /admin/dlq/reprocess-batch:
    post:
      summary: Reprocessa em lote itens da DLQ
      description: Executa o reprocessamento com isolamento de falhas para múltiplos registros.
      tags:
        - Admin - DLQ
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlqBatchReprocessRequest'
      responses:
        '200':
          description: Relatório consolidado do reprocessamento em lote
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DlqBatchReprocessResultDto'
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso restrito a administradores
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /admin/tickers:
    get:
      summary: Lista tickers cadastrados no mestre de dados
      description: Retorna ativos cadastrados no dicionário mestre com filtros opcionais.
      tags:
        - Admin - Tickers
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: assetClass
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de tickers retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminTickerDto'
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso restrito a administradores
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      summary: Cadastra um novo ticker no mestre de dados
      description: Cria novo registro de ativo no mestre global e invalida cache de cotação.
      tags:
        - Admin - Tickers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminTickerRequest'
      responses:
        '201':
          description: Ticker cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminTickerDto'
        '400':
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso restrito a administradores
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Ticker já cadastrado no dicionário mestre
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /admin/tickers/{id}:
    put:
      summary: Atualiza dados de um ticker existente
      description: Atualiza nome, classe e setor de um ticker no mestre de dados.
      tags:
        - Admin - Tickers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminTickerRequest'
      responses:
        '200':
          description: Ticker atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminTickerDto'
        '400':
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso restrito a administradores
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Ticker não encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: Remove um ticker do mestre de dados
      description: Exclui o ticker cadastrado caso não possua vínculos impeditivos.
      tags:
        - Admin - Tickers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Ticker removido com sucesso
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso restrito a administradores
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Ticker não encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Ticker possui vínculos de integridade referencial impeditivos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /admin/tickers/cache/clear:
    post:
      summary: Limpa todo o cache de Market Data
      description: Invalida integralmente as cotações em memória forçando recarregamento da API externa.
      tags:
        - Admin - Tickers
      responses:
        '200':
          description: Cache limpo com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CacheEvictionResultDto'
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso restrito a administradores
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /admin/tickers/{ticker}/cache/evict:
    post:
      summary: Invalida cache de Market Data para um ticker específico
      description: Força remoção seletiva da cotação em memória do ticker informado.
      tags:
        - Admin - Tickers
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cache do ticker invalidado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CacheEvictionResultDto'
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso restrito a administradores
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /dividends/schedule:
    get:
      summary: Consulta agenda de proventos
      description: Retorna a agenda consolidada de dividendos, JCP e rendimentos.
      tags:
        - Dividends
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
        - name: onlyMyTickers
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Lista de proventos programados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DividendScheduleItem'
  /dividends/facts:
    get:
      summary: Consulta fatos relevantes
      description: Retorna comunicados e fatos relevantes corporativos.
      tags:
        - Dividends
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: onlyMyTickers
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Lista de fatos relevantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelevantFactItem'
  /admin/crawler/dividends/sync:
    post:
      summary: Disparo manual de sincronização de proventos e fatos relevantes
      description: Endpoint restrito a administradores para forçar varredura de eventos corporativos.
      tags:
        - Admin
      responses:
        '200':
          description: Resultado da sincronização de eventos corporativos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateEventSyncSummary'
        '403':
          description: Acesso restrito a administradores
  /api/v1/open-finance/institutions:
    get:
      summary: Lista instituições parceiras disponíveis para Open Finance
      tags:
        - Open Finance
      responses:
        '200':
          description: Lista de instituições parceiras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenFinanceInstitutionItem'
  /api/v1/open-finance/connections:
    get:
      summary: Lista conexões Open Finance ativas do investidor
      tags:
        - Open Finance
      responses:
        '200':
          description: Lista de conexões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenFinanceConnectionItem'
    post:
      summary: Inicia conexão Open Finance gerando URL de consentimento
      tags:
        - Open Finance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateOpenFinanceConnectionRequest'
      responses:
        '201':
          description: Conexão iniciada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentUrlResponse'
  /api/v1/open-finance/connections/callback:
    post:
      summary: Processa callback de autorização e ativa conexão Open Finance
      tags:
        - Open Finance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeConsentCallbackRequest'
      responses:
        '200':
          description: Conexão ativada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFinanceConnectionItem'
  /api/v1/open-finance/connections/{id}/sync:
    post:
      summary: Dispara sincronização sob demanda de uma conexão Open Finance
      tags:
        - Open Finance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resultado da sincronização
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFinanceSyncResult'
  /api/v1/open-finance/connections/{id}:
    delete:
      summary: Desconecta e revoga consentimento de conexão Open Finance
      tags:
        - Open Finance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Conexão revogada com sucesso
  /api/v1/open-finance/webhook:
    post:
      summary: Webhook para notificações assíncronas de parceiros Open Finance
      tags:
        - Open Finance
      parameters:
        - name: X-Webhook-Secret
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Evento recebido com sucesso
        '401':
          description: Segredo de webhook inválido ou ausente

components:
  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        tier:
          $ref: '#/components/schemas/SubscriptionTier'
        investorProfile:
          $ref: '#/components/schemas/InvestorProfile'
        trialEndsAt:
          type: string
          format: date-time
        daysRemaining:
          type: integer
        role:
          type: string
          enum: [USER, ADMIN]
          example: "USER"
    UpdateProfileRequest:
      type: object
      properties:
        investorProfile:
          $ref: '#/components/schemas/InvestorProfile'
    InvestorProfile:
      type: string
      enum: [CONSERVATIVE, MODERATE, AGGRESSIVE]
    DeletionRequestResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            requestId:
              type: integer
              format: int64
            status:
              type: string
              example: "PENDING"
            estimatedCompletionWithin:
              type: string
              example: "24h"
    SubscriptionTier:
      type: string
      enum: [TRIAL, FREE, PREMIUM]
    RankedCompany:
      type: object
      properties:
        symbol:
          type: string
          example: "PETR4"
        name:
          type: string
          example: "Petrobras"
        intrinsicValue:
          type: number
          format: double
          example: 45.50
        currentPrice:
          type: number
          format: double
          example: 35.20
        marginOfSafety:
          type: number
          format: double
          example: 0.22
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Erro interno no servidor."
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
    DlqMessageDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: string
        correlationId:
          type: string
        anonymizedUserId:
          type: string
          example: "usr_***a1b2"
        fileName:
          type: string
        lineNumber:
          type: integer
          format: int64
        errorMessage:
          type: string
        originalTopic:
          type: string
        status:
          type: string
          enum: [PENDING, REPROCESSING, RESOLVED, FAILED]
        timestamp:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
    DlqReprocessResultDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, REPROCESSING, RESOLVED, FAILED]
        message:
          type: string
    DlqBatchReprocessRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
    DlqBatchReprocessResultDto:
      type: object
      properties:
        totalProcessed:
          type: integer
        successCount:
          type: integer
        failureCount:
          type: integer
        details:
          type: array
          items:
            $ref: '#/components/schemas/DlqReprocessResultDto'
    AdminTickerDto:
      type: object
      properties:
        id:
          type: string
        ticker:
          type: string
          example: "PETR4"
        name:
          type: string
          example: "Petrobras PN"
        assetClass:
          type: string
          example: "Ações"
        sector:
          type: string
          example: "Petróleo e Gás"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateAdminTickerRequest:
      type: object
      required:
        - ticker
      properties:
        ticker:
          type: string
          example: "BBAS3"
        name:
          type: string
          example: "Banco do Brasil S.A."
        assetClass:
          type: string
          example: "Ações"
        sector:
          type: string
          example: "Financeiro"
    UpdateAdminTickerRequest:
      type: object
      properties:
        name:
          type: string
          example: "Banco do Brasil S.A."
        assetClass:
          type: string
          example: "Ações"
        sector:
          type: string
          example: "Financeiro"
    CacheEvictionResultDto:
      type: object
      properties:
        message:
          type: string
          example: "Cache de Market Data limpo com sucesso."
        timestamp:
          type: string
          format: date-time
    DividendScheduleItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticker:
          type: string
        type:
          type: string
          enum: [DIVIDENDO, JCP, RENDIMENTO, BONIFICACAO, DESDOBRAMENTO]
        rate:
          type: number
        netValue:
          type: number
        approvedDate:
          type: string
          format: date
        comDate:
          type: string
          format: date
        exDate:
          type: string
