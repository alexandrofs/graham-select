openapi: 3.0.3
info:
  title: Graham Select System - OpenAPI 3.0
  version: 1.0.0
  description: >-
    Aplicativo para identificar as 20 empresas mais baratas usando a regra de
    Benjamin Graham.
  contact:
    email: afssistemas@gmail.com
    name: Alexandro Sousa
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://domain/api/v1
tags:
  - name: Financial Data
    description: Dados financeiros das empresas
paths:
  /upload-financial-data:
    post:
      summary: Upload de arquivos de dados financeiros
      description: Endpoint para enviar arquivos de dados financeiros para o sistema.
      tags:
        - Financial Data
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo CSV contendo dados financeiros das empresas.
      responses:
        '200':
          description: Upload bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Arquivo carregado com sucesso."
        '400':
          description: Requisição inválida ou arquivo incorreto
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro ao processar o arquivo. Verifique o formato."
        '500':
          description: Erro interno no servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro no servidor ao processar o upload."
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro inesperado. Entre em contato com o suporte."
  /ranked-companies:
    get:
      summary: Consulta das empresas ranqueadas
      description: Retorna as 20 empresas mais baratas com base no cálculo do valor intrínseco.
      tags:
        - Financial Data
      responses:
        '200':
          description: Lista de empresas ranqueadas retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankedCompany'
        '403':
          description: Funcionalidade disponível apenas para assinantes Premium ou Trial válido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erro interno no servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me:
    get:
      summary: Retorna o perfil do usuário atual
      description: Retorna o perfil do usuário autenticado no sistema.
      tags:
        - User
      responses:
        '200':
          description: Perfil do usuário retornado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno no servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Solicita a exclusão permanente da conta
      description: Inicia o processo de expurgo de dados conforme LGPD. O processo é assíncrono.
      tags:
        - User
      responses:
        '202':
          description: Solicitação de exclusão aceita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequestResponse'
        '409':
          description: Já existe uma solicitação pendente para este usuário
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /users/me/cancel-deletion:
    post:
      summary: Cancela uma solicitação de exclusão pendente
      description: Se o expurgo ainda não tiver sido executado, cancela a solicitação.
      tags:
        - User
      responses:
        '200':
          description: Solicitação cancelada com sucesso
        '404':
          description: Nenhuma solicitação pendente encontrada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /users/profile:
    patch:
      summary: Atualiza o perfil do investidor
      description: Atualiza o perfil do investidor (Suitability) do usuário autenticado.
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno no servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        tier:
          $ref: '#/components/schemas/SubscriptionTier'
        investorProfile:
          $ref: '#/components/schemas/InvestorProfile'
        trialEndsAt:
          type: string
          format: date-time
        daysRemaining:
          type: integer
    UpdateProfileRequest:
      type: object
      properties:
        investorProfile:
          $ref: '#/components/schemas/InvestorProfile'
    InvestorProfile:
      type: string
      enum: [CONSERVATIVE, MODERATE, AGGRESSIVE]
    DeletionRequestResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            requestId:
              type: integer
              format: int64
            status:
              type: string
              example: "PENDING"
            estimatedCompletionWithin:
              type: string
              example: "24h"
    SubscriptionTier:
      type: string
      enum: [TRIAL, FREE, PREMIUM]
    RankedCompany:
      type: object
      properties:
        symbol:
          type: string
          example: "PETR4"
        name:
          type: string
          example: "Petrobras"
        intrinsicValue:
          type: number
          format: double
          example: 45.50
        currentPrice:
          type: number
          format: double
          example: 35.20
        marginOfSafety:
          type: number
          format: double
          example: 0.22
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Erro interno no servidor."
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
