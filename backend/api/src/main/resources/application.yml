spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:api-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  cache:
    caffeine:
      spec: maximumSize=500,expireAfterWrite=86400s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://securetoken.google.com/graham-select
          jwk-set-uri: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com

app:
  upload:
    storage-path: ${STORAGE_PATH:./uploads}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5000,https://graham-select-frontend.onrender.com}

brapi:
  token: ${BRAPI_TOKEN:}

market-data:
  sync:
    cron: ${MARKET_DATA_SYNC_CRON:0 0 20 * * MON-FRI}

corporate-events:
  sync:
    cron: ${CORPORATE_EVENTS_SYNC_CRON:0 0 21 * * MON-FRI}

crawler:
  user-agent: ${CRAWLER_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36 GrahamSelectCrawler/1.0}
  timeout-ms: ${CRAWLER_TIMEOUT_MS:10000}

openfinance:
  encryption:
    secret-key: ${OPENFINANCE_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
  sync:
    cron: ${OPENFINANCE_SYNC_CRON:0 0 6 * * *}
  webhook:
    secret: ${OPENFINANCE_WEBHOOK_SECRET:sandbox-openfinance-webhook-secret-2026}
  mock:
    enabled: ${OPENFINANCE_MOCK_ENABLED:true}
  client:
    connect-timeout-ms: ${OPENFINANCE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OPENFINANCE_READ_TIMEOUT_MS:15000}

whatsapp:
  provider: ${WHATSAPP_PROVIDER:mock}
  alerts:
    cron: ${WHATSAPP_ALERTS_CRON:0 0 9 * * MON-FRI}
  meta:
    base-url: ${WHATSAPP_META_BASE_URL:https://graph.facebook.com/v21.0}
    phone-number-id: ${WHATSAPP_META_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_META_ACCESS_TOKEN:}
    connect-timeout-ms: ${WHATSAPP_META_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${WHATSAPP_META_READ_TIMEOUT_MS:10000}


