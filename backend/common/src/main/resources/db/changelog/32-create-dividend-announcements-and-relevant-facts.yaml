databaseChangeLog:
  - changeSet:
      id: 32-create-dividend-announcements-table
      author: bmad-dev
      changes:
        - createTable:
            tableName: dividend_announcements
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticker
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: rate
                  type: DECIMAL(16,6)
                  constraints:
                    nullable: false
              - column:
                  name: net_value
                  type: DECIMAL(16,6)
                  constraints:
                    nullable: true
              - column:
                  name: approved_date
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: com_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: ex_date
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: payment_date
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: source
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: dividend_announcements
            columnNames: ticker, com_date, type, rate
            constraintName: uq_dividend_announcements_ticker_com_type_rate
        - createIndex:
            tableName: dividend_announcements
            indexName: idx_dividend_announcements_ticker_com
            columns:
              - column:
                  name: ticker
              - column:
                  name: com_date
        - createIndex:
            tableName: dividend_announcements
            indexName: idx_dividend_announcements_ticker_pay
            columns:
              - column:
                  name: ticker
              - column:
                  name: payment_date

  - changeSet:
      id: 32-create-relevant-facts-table
      author: bmad-dev
      changes:
        - createTable:
            tableName: relevant_facts
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticker
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: summary
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: source_url
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: publication_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: relevant_facts
            indexName: idx_relevant_facts_ticker_pub_date
            columns:
              - column:
                  name: ticker
              - column:
                  name: publication_date
