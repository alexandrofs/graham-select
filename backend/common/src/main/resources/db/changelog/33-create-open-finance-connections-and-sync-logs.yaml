databaseChangeLog:
  - changeSet:
      id: 33-create-open-finance-connections-table
      author: bmad-dev
      changes:
        - createTable:
            tableName: open_finance_connections
            columns:
              - column:
                  name: id
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: profile_id
                  type: CHAR(36)
                  constraints:
                    nullable: true
              - column:
                  name: institution_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: institution_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: institution_logo_url
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: consent_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: encrypted_access_token
                  type: VARCHAR(2048)
                  constraints:
                    nullable: true
              - column:
                  name: encrypted_refresh_token
                  type: VARCHAR(2048)
                  constraints:
                    nullable: true
              - column:
                  name: consent_expires_at
                  type: DATETIME
                  constraints:
                    nullable: true
              - column:
                  name: last_sync_at
                  type: DATETIME
                  constraints:
                    nullable: true
              - column:
                  name: last_sync_status
                  type: VARCHAR(30)
                  constraints:
                    nullable: true
              - column:
                  name: error_message
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - createIndex:
            tableName: open_finance_connections
            indexName: idx_ofc_user_status
            columns:
              - column:
                  name: user_id
              - column:
                  name: status
        - createIndex:
            tableName: open_finance_connections
            indexName: idx_ofc_user_inst_prof
            unique: true
            columns:
              - column:
                  name: user_id
              - column:
                  name: institution_id
              - column:
                  name: profile_id

  - changeSet:
      id: 33-create-open-finance-sync-logs-table
      author: bmad-dev
      changes:
        - createTable:
            tableName: open_finance_sync_logs
            columns:
              - column:
                  name: id
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: connection_id
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: DATETIME
                  constraints:
                    nullable: true
              - column:
                  name: sync_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: positions_fetched
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: transactions_fetched
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: trades_created
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: trades_duplicated
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: error_details
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: open_finance_sync_logs
            baseColumnNames: connection_id
            referencedTableName: open_finance_connections
            referencedColumnNames: id
            constraintName: fk_ofsl_connection_id
            onDelete: CASCADE
        - createIndex:
            tableName: open_finance_sync_logs
            indexName: idx_ofsl_conn_started
            columns:
              - column:
                  name: connection_id
              - column:
                  name: started_at
        - createIndex:
            tableName: open_finance_sync_logs
            indexName: idx_ofsl_user_started
            columns:
              - column:
                  name: user_id
              - column:
                  name: started_at
