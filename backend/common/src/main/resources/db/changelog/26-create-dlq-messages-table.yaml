databaseChangeLog:
  - changeSet:
      id: 26-create-dlq-messages-table
      author: graham-select-dev
      changes:
        - createTable:
            tableName: dlq_messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: correlation_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: line_number
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: error_message
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: original_payload
                  type: CLOB
                  constraints:
                    nullable: true
              - column:
                  name: original_topic
                  type: VARCHAR(100)
                  defaultValue: trade-extracted
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: resolved_at
                  type: DATETIME
                  constraints:
                    nullable: true
        - createIndex:
            indexName: idx_dlq_messages_status_created
            tableName: dlq_messages
            columns:
              - column:
                  name: status
              - column:
                  name: created_at
        - createIndex:
            indexName: idx_dlq_messages_correlation
            tableName: dlq_messages
            columns:
              - column:
                  name: correlation_id
      rollback:
        - dropTable:
            tableName: dlq_messages
