databaseChangeLog:
  - changeSet:
      id: 40-create-tb-ai-diagnostic-cache
      author: bmad-dev
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: tb_ai_diagnostic_cache
      changes:
        - createTable:
            tableName: tb_ai_diagnostic_cache
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: portfolio_state_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: model_version
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: prompt_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: json_payload
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: tb_ai_diagnostic_cache
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_ai_cache_user
            onDelete: CASCADE
        - createIndex:
            tableName: tb_ai_diagnostic_cache
            indexName: idx_ai_cache_lookup
            columns:
              - column:
                  name: user_id
              - column:
                  name: portfolio_state_hash
              - column:
                  name: model_version
              - column:
                  name: prompt_version
        - createIndex:
            tableName: tb_ai_diagnostic_cache
            indexName: idx_ai_cache_user_expires
            columns:
              - column:
                  name: user_id
              - column:
                  name: expires_at
      rollback:
        - dropTable:
            tableName: tb_ai_diagnostic_cache

  - changeSet:
      id: 40-create-tb-ai-usage-counter
      author: bmad-dev
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: tb_ai_usage_counter
      changes:
        - createTable:
            tableName: tb_ai_usage_counter
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: usage_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: daily_call_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: tb_ai_usage_counter
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_ai_usage_user
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: tb_ai_usage_counter
            columnNames: user_id, usage_date
            constraintName: uq_ai_usage_user_date
      rollback:
        - dropTable:
            tableName: tb_ai_usage_counter
