databaseChangeLog:
  - changeSet:
      id: 27-add-asset-class-to-company
      author: graham-select-dev
      changes:
        - addColumn:
            tableName: company
            columns:
              - column:
                  name: asset_class
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: sector
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: true
        - createIndex:
            indexName: idx_company_asset_class
            tableName: company
            columns:
              - column:
                  name: asset_class
      rollback:
        - dropIndex:
            indexName: idx_company_asset_class
            tableName: company
        - dropColumn:
            tableName: company
            columnName: asset_class
        - dropColumn:
            tableName: company
            columnName: sector
        - dropColumn:
            tableName: company
            columnName: created_at
        - dropColumn:
            tableName: company
            columnName: updated_at
