databaseChangeLog:
  - changeSet:
      id: 18-fix-manual-trade-audits-uuid-columns-mysql
      author: alex
      dbms: mysql
      changes:
        - addColumn:
            tableName: manual_trade_audits
            columns:
              - column:
                  name: id_temp
                  type: CHAR(36)
              - column:
                  name: trade_id_temp
                  type: CHAR(36)
        - sql:
            dbms: mysql
            sql: UPDATE manual_trade_audits SET id_temp = BIN_TO_UUID(id), trade_id_temp = BIN_TO_UUID(trade_id)
        - dropPrimaryKey:
            tableName: manual_trade_audits
            constraintName: PRIMARY
        - dropColumn:
            tableName: manual_trade_audits
            columnName: id
        - dropColumn:
            tableName: manual_trade_audits
            columnName: trade_id
        - renameColumn:
            tableName: manual_trade_audits
            oldColumnName: id_temp
            newColumnName: id
            columnDataType: CHAR(36)
        - renameColumn:
            tableName: manual_trade_audits
            oldColumnName: trade_id_temp
            newColumnName: trade_id
            columnDataType: CHAR(36)
        - addNotNullConstraint:
            tableName: manual_trade_audits
            columnName: id
            columnDataType: CHAR(36)
        - addNotNullConstraint:
            tableName: manual_trade_audits
            columnName: trade_id
            columnDataType: CHAR(36)
        - addPrimaryKey:
            tableName: manual_trade_audits
            columnNames: id
            constraintName: pk_manual_trade_audits

  - changeSet:
      id: 18-fix-manual-trade-audits-uuid-columns-generic
      author: alex
      dbms: h2, postgresql
      changes:
        - modifyDataType:
            tableName: manual_trade_audits
            columnName: id
            newDataType: CHAR(36)
        - modifyDataType:
            tableName: manual_trade_audits
            columnName: trade_id
            newDataType: CHAR(36)
