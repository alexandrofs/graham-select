databaseChangeLog:
  - changeSet:
      id: 25-add-role-to-users
      author: graham-select-dev
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: role
                  type: VARCHAR(20)
                  defaultValue: USER
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: users
            columnName: role
