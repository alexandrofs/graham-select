databaseChangeLog:
  - changeSet:
      id: 21-add-eps-bvps-to-graham-recommendations
      author: ant-gravity
      changes:
        - addColumn:
            tableName: graham_recommendations
            columns:
              - column:
                  name: eps_used
                  type: DECIMAL(18,4)
                  constraints:
                    nullable: true
              - column:
                  name: bvps_used
                  type: DECIMAL(18,4)
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: graham_recommendations
            columnName: eps_used
        - dropColumn:
            tableName: graham_recommendations
            columnName: bvps_used
