apiVersion: v1
kind: Secret
metadata:
  name: {{ include "graham-select.fullname" . }}-secret
  labels:
    {{- include "graham-select.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_PASSWORD: {{ .Values.database.password | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.database.password | quote }}
  {{- if .Values.secrets.jwtSecretKey }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.brapiToken }}
  BRAPI_TOKEN: {{ .Values.secrets.brapiToken | quote }}
  {{- end }}
  {{- if .Values.secrets.openfinanceEncryptionKey }}
  OPENFINANCE_ENCRYPTION_KEY: {{ .Values.secrets.openfinanceEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openfinanceWebhookSecret }}
  OPENFINANCE_WEBHOOK_SECRET: {{ .Values.secrets.openfinanceWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.whatsappMetaAccessToken }}
  WHATSAPP_META_ACCESS_TOKEN: {{ .Values.secrets.whatsappMetaAccessToken | quote }}
  {{- end }}
  {{- if .Values.secrets.whatsappMetaPhoneNumberId }}
  WHATSAPP_META_PHONE_NUMBER_ID: {{ .Values.secrets.whatsappMetaPhoneNumberId | quote }}
  {{- end }}
  {{- if .Values.secrets.webpushVapidPrivateKey }}
  WEBPUSH_VAPID_PRIVATE_KEY: {{ .Values.secrets.webpushVapidPrivateKey | quote }}
  {{- end }}
  {{- if .Values.secrets.webpushVapidPublicKey }}
  WEBPUSH_VAPID_PUBLIC_KEY: {{ .Values.secrets.webpushVapidPublicKey | quote }}
  {{- end }}
  {{- if .Values.secrets.gcpVertexCredentialsJson }}
  GCP_VERTEX_CREDENTIALS_JSON: {{ .Values.secrets.gcpVertexCredentialsJson | quote }}
  {{- end }}
