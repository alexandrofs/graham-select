apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "graham-select.fullname" . }}-config
  labels:
    {{- include "graham-select.labels" . | nindent 4 }}
data:
  # Database Parameters
  MYSQL_HOST: {{ .Values.database.host | quote }}
  MYSQL_PORT: {{ .Values.database.port | quote }}
  MYSQL_DATABASE: {{ .Values.database.name | quote }}
  MYSQL_USER: {{ .Values.database.user | quote }}
  SPRING_DATASOURCE_URL: "jdbc:mysql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?{{ .Values.database.extraParams }}"
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.user | quote }}

  # Kafka Parameters (Dedicated namespace 'kafka')
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers | quote }}
  KAFKA_CONSUMER_GROUP_ID: {{ .Values.kafka.consumerGroupId | quote }}

  # Application Parameters
  SPRING_PROFILES_ACTIVE: "prod"
  FRONTEND_URL: {{ .Values.api.env.FRONTEND_URL | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.api.env.CORS_ALLOWED_ORIGINS | quote }}
  BPL_JVM_THREAD_COUNT: {{ .Values.api.env.BPL_JVM_THREAD_COUNT | default "50" | quote }}
  JAVA_TOOL_OPTIONS: {{ .Values.api.env.JAVA_TOOL_OPTIONS | default "-Xss512k -XX:ReservedCodeCacheSize=64M -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8" | quote }}
  STORAGE_PATH: {{ .Values.api.env.STORAGE_PATH | default "/data/uploads" | quote }}
  MARKET_DATA_SYNC_CRON: {{ .Values.api.env.MARKET_DATA_SYNC_CRON | quote }}
  CORPORATE_EVENTS_SYNC_CRON: {{ .Values.api.env.CORPORATE_EVENTS_SYNC_CRON | quote }}
  OPENFINANCE_SYNC_CRON: {{ .Values.api.env.OPENFINANCE_SYNC_CRON | quote }}
  OPENFINANCE_MOCK_ENABLED: {{ .Values.api.env.OPENFINANCE_MOCK_ENABLED | quote }}

  # Notifications Parameters
  WHATSAPP_PROVIDER: {{ .Values.api.env.WHATSAPP_PROVIDER | default "mock" | quote }}
  WHATSAPP_ALERTS_CRON: {{ .Values.api.env.WHATSAPP_ALERTS_CRON | default "0 0 9 * * MON-FRI" | quote }}
  WHATSAPP_META_BASE_URL: {{ .Values.api.env.WHATSAPP_META_BASE_URL | default "https://graph.facebook.com/v21.0" | quote }}
  WEBPUSH_PROVIDER: {{ .Values.api.env.WEBPUSH_PROVIDER | default "mock" | quote }}
  WEBPUSH_ALERTS_CRON: {{ .Values.api.env.WEBPUSH_ALERTS_CRON | default "0 15 20 * * MON-FRI" | quote }}
  WEBPUSH_VAPID_SUBJECT: {{ .Values.api.env.WEBPUSH_VAPID_SUBJECT | default "mailto:kerno@afsdigital.com.br" | quote }}
  FOUNDER_TOTAL_SLOTS: {{ .Values.api.env.FOUNDER_TOTAL_SLOTS | default "250" | quote }}
  FOUNDER_PRO_TRIAL_DAYS: {{ .Values.api.env.FOUNDER_PRO_TRIAL_DAYS | default "90" | quote }}
