# ==============================================================================
# Kerno - Default Values for Helm Chart (Oracle OKE)
# ==============================================================================

global:
  imagePullSecrets: []

# ------------------------------------------------------------------------------
# Backend API Spring Boot Configuration
# ------------------------------------------------------------------------------
api:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/alexandrofs/graham-select-api
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  env:
    SPRING_PROFILES_ACTIVE: "prod"
    SERVER_PORT: "8080"
    FRONTEND_URL: "https://kerno.afsdigital.com.br"
    CORS_ALLOWED_ORIGINS: "https://kerno.afsdigital.com.br"
    BPL_JVM_THREAD_COUNT: "50"
    JAVA_TOOL_OPTIONS: "-Xss512k -XX:ReservedCodeCacheSize=64M -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
    STORAGE_PATH: "/data/uploads"
    MARKET_DATA_SYNC_CRON: "0 0 20 * * MON-FRI"
    CORPORATE_EVENTS_SYNC_CRON: "0 0 21 * * MON-FRI"
    OPENFINANCE_SYNC_CRON: "0 0 6 * * *"
    OPENFINANCE_MOCK_ENABLED: "false"
    WHATSAPP_PROVIDER: "mock"
    WHATSAPP_ALERTS_CRON: "0 0 9 * * MON-FRI"
    WHATSAPP_META_BASE_URL: "https://graph.facebook.com/v21.0"
    WEBPUSH_PROVIDER: "mock"
    WEBPUSH_ALERTS_CRON: "0 15 20 * * MON-FRI"
    WEBPUSH_VAPID_SUBJECT: "mailto:kerno@afsdigital.com.br"
    FOUNDER_TOTAL_SLOTS: "250"
    FOUNDER_PRO_TRIAL_DAYS: "90"
    ENABLE_EXPENSES_MODULE: "false"
    AI_DAILY_RATE_LIMIT: "5"
    AI_MONTHLY_RATE_LIMIT: "30"
    AI_CACHE_TTL_HOURS: "24"
    CRAWLER_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36 KernoCrawler/1.0"

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  probes:
    liveness:
      path: /actuator/health
      port: 8080
      initialDelaySeconds: 45
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health
      port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# ------------------------------------------------------------------------------
# Backend Valuation Service Configuration
# ------------------------------------------------------------------------------
valuation:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/alexandrofs/graham-select-valuation
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081

  env:
    SPRING_PROFILES_ACTIVE: "prod"
    SERVER_PORT: "8081"
    BPL_JVM_THREAD_COUNT: "30"
    JAVA_TOOL_OPTIONS: "-Xss512k -XX:ReservedCodeCacheSize=64M -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
    AI_VERTEX_PROJECT_ID: ""
    AI_VERTEX_LOCATION: "us-central1"
    AI_VERTEX_MODEL_NAME: "gemini-2.5-flash"

  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 768Mi

  probes:
    liveness:
      path: /actuator/health
      port: 8081
      initialDelaySeconds: 45
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health
      port: 8081
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# ------------------------------------------------------------------------------
# Shared Database (OCI MySQL Database Service)
# ------------------------------------------------------------------------------
database:
  host: "10.0.20.233"
  port: 3306
  name: "grahamselect"
  user: "afsadmin"
  password: "" # Preenchido via pipeline / secret
  extraParams: "createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo"

# ------------------------------------------------------------------------------
# Shared Kafka (Dedicated namespace 'kafka')
# ------------------------------------------------------------------------------
kafka:
  bootstrapServers: "kafka.kafka.svc.cluster.local:9092"
  consumerGroupId: "api-group"

# ------------------------------------------------------------------------------
# Secrets Configuration
# ------------------------------------------------------------------------------
secrets:
  jwtSecretKey: ""
  googleClientSecret: ""
  brapiToken: ""
  openfinanceEncryptionKey: ""
  openfinanceWebhookSecret: ""
  whatsappMetaAccessToken: ""
  whatsappMetaPhoneNumberId: ""
  webpushVapidPrivateKey: ""
  webpushVapidPublicKey: ""
  gcpVertexCredentialsJson: ""

# ------------------------------------------------------------------------------
# Frontend Flutter Web Configuration
# ------------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/alexandrofs/graham-select-frontend
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  probes:
    liveness:
      path: /healthz
      port: 8080
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /healthz
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# ------------------------------------------------------------------------------
# Ingress and TLS Configuration (kerno.afsdigital.com.br)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  host: "kerno.afsdigital.com.br"
  tls:
    enabled: true
    secretName: "graham-select-tls-secret"
