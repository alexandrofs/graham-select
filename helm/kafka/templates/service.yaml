apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: client
      port: {{ .Values.service.port }}
      targetPort: 9092
      protocol: TCP
    - name: controller
      port: {{ .Values.service.controllerPort }}
      targetPort: 9093
      protocol: TCP
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
