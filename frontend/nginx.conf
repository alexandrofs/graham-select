server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /workspace/build/web;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    # Public static institutional pages (decoupled from Flutter Web / CanvasKit)
    location = / {
        add_header X-Robots-Tag "index, follow" always;
        try_files /landing.html =404;
    }

    location ~ ^/(terms|privacy)/?$ {
        add_header X-Robots-Tag "index, follow" always;
        try_files /$1.html =404;
    }

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8" always;
        try_files /robots.txt =404;
    }

    # Public Flutter Web documentation route
    location = /docs {
        add_header X-Robots-Tag "index, follow" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /docs/ {
        add_header X-Robots-Tag "index, follow" always;
        try_files $uri $uri/ /index.html;
    }

    # Private / authenticated SPA routes blocked from search engine indexing
    location = /app {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /app/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location = /dashboard {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /dashboard/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # Fallback to index.html for SPA client-side routing
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets with cache headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Health check endpoint for Kubernetes liveness/readiness probes
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
