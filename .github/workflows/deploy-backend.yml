name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}-api
  IMAGE_NAME_VALUATION: ${{ github.repository }}-valuation

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Image Names
        run: |
          echo "IMAGE_NAME_API=${GITHUB_REPOSITORY,,}-api" >> $GITHUB_ENV
          echo "IMAGE_NAME_VALUATION=${GITHUB_REPOSITORY,,}-valuation" >> $GITHUB_ENV

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          cache: maven

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and install dependencies
        run: |
          cd backend
          mvn clean install -DskipTests

      - name: Extract metadata (tags, labels) for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}

      - name: Build API image
        run: |
          cd backend
          mvn -Pnative spring-boot:build-image -pl api -am \
            -Dspring-boot.build-image.imageName=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:latest

      - name: Test API image locally
        run: |
          docker compose up -d
          sleep 15
          docker run -d --name test-api --network host \
            -e SPRING_PROFILES_ACTIVE=local \
            -e SPRING_DATASOURCE_URL='jdbc:mysql://127.0.0.1:3306/grahamselect?useSSL=false&allowPublicKeyRetrieval=true' \
            -e SPRING_DATASOURCE_USERNAME=root \
            -e SPRING_DATASOURCE_PASSWORD=root \
            -e KAFKA_BOOTSTRAP_SERVERS='127.0.0.1:9094' \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:latest
          
          sleep 10
          docker logs test-api
          
          if [ "$(docker inspect -f '{{.State.Running}}' test-api)" != "true" ]; then
            echo "API container crashed during startup"
            exit 1
          fi
          
          curl -f http://localhost:8080/actuator/health || (echo "Healthcheck failed" && exit 1)
          docker rm -f test-api

      - name: Push API image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:latest

      - name: Extract metadata (tags, labels) for Valuation
        id: meta-valuation
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_VALUATION }}

      - name: Build Valuation image
        run: |
          cd backend
          mvn -Pnative spring-boot:build-image -pl valuation-service -am \
            -Dspring-boot.build-image.imageName=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_VALUATION }}:latest

      - name: Test Valuation image locally
        run: |
          docker run -d --name test-valuation --network host \
            -e SPRING_PROFILES_ACTIVE=local \
            -e SERVER_PORT=8081 \
            -e SPRING_DATASOURCE_URL='jdbc:mysql://127.0.0.1:3306/grahamselect?useSSL=false&allowPublicKeyRetrieval=true' \
            -e SPRING_DATASOURCE_USERNAME=root \
            -e SPRING_DATASOURCE_PASSWORD=root \
            -e KAFKA_BOOTSTRAP_SERVERS='127.0.0.1:9094' \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_VALUATION }}:latest
            
          sleep 10
          docker logs test-valuation
          
          if [ "$(docker inspect -f '{{.State.Running}}' test-valuation)" != "true" ]; then
            echo "Valuation container crashed during startup"
            docker rm -f test-valuation
            docker compose down
            exit 1
          fi
          
          curl -f http://localhost:8081/actuator/health || (echo "Healthcheck failed" && exit 1)
          docker rm -f test-valuation
          docker compose down

      - name: Push Valuation image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_VALUATION }}:latest

      - name: Trigger Render Deploy for API
        run: |
          if [ -n "${{ secrets.RENDER_API_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render deployment for API..."
            curl -X POST "${{ secrets.RENDER_API_DEPLOY_HOOK }}"
          else
            echo "RENDER_API_DEPLOY_HOOK secret not found, skipping."
          fi
          
      - name: Trigger Render Deploy for Valuation
        run: |
          if [ -n "${{ secrets.RENDER_VALUATION_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render deployment for Valuation Service..."
            curl -X POST "${{ secrets.RENDER_VALUATION_DEPLOY_HOOK }}"
          else
            echo "RENDER_VALUATION_DEPLOY_HOOK secret not found, skipping."
          fi
