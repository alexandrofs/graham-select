name: Flutter CI

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  test:
    name: Run Flutter Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: ./frontend
        run: flutter pub get
      
      - name: Analyze code
        working-directory: ./frontend
        run: flutter analyze
      
      - name: Run tests
        working-directory: ./frontend
        run: flutter test --coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: ./frontend
        run: flutter pub get
      
      - name: Build Web
        working-directory: ./frontend
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}" \
            --dart-define=GOOGLE_CLIENT_ID="${{ vars.GOOGLE_CLIENT_ID }}" \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${{ vars.FIREBASE_STORAGE_BUCKET }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ vars.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=FIREBASE_APP_ID="${{ vars.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_MEASUREMENT_ID="${{ vars.FIREBASE_MEASUREMENT_ID }}"


      - name: Prepare Web Build for Buildpack
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        working-directory: ./frontend/build/web
        run: |
          mkdir public
          cp -r ./* public/ 2>/dev/null || true
          ls -A | grep -v public | xargs rm -rf

      - name: Setup pack CLI
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: buildpacks/github-actions/setup-pack@v5.7.0

      - name: Login to GHCR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          pack build ghcr.io/${{ github.repository }}-frontend:latest \
            --path ./frontend/build/web \
            --builder paketobuildpacks/builder-jammy-base \
            --buildpack paketo-buildpacks/web-servers \
            --env BP_WEB_SERVER=nginx \
            --env BP_WEB_SERVER_ENABLE_PUSH_STATE=true \
            --publish

      - name: Trigger Render Deploy for Frontend
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render deployment for Frontend..."
            curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK secret not found, skipping."
          fi
